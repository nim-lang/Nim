CONSTANTS
    Threads = {t1, t2}
    MaxChunks = 3
    SizeClass = 1
    MaxCells = 6

SPECIFICATION Spec

INVARIANTS
    TypeOK
    NoLeakInvariant
    UniqueFreeListMembership
    NoAllocatedInFreeList

\* We can't easily check ForeignCellsAccurate in all states
\* as it requires complex counting, but we can check simpler properties

PROPERTIES
    \* Eventually some allocation should succeed if we have space
    \* <>(\E t \in Threads : nextCell > 1)

\* Constraint to limit state space (optional)
CONSTRAINT
    nextCell <= MaxCells + 1

\* Action constraints to make model checking more efficient
\* SYMMETRY Threads
