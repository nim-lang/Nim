name: Nim CI
# The main test suite (`koch runCI`). Previously `azure-pipelines.yml`; moved
# here because the GitHub-hosted runners are 4-core (3-core on macOS arm64)
# whereas the Microsoft-hosted Azure agents are 2-core, which measured ~2.3x
# faster on an identical `koch boot -d:release`.

on:
  push:
    branches:
      - 'devel'
      - 'version-*'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Routes the matrix entries marked with `pool:` to the self-hosted runners
  # (labels `wsl` / `windows`) if they are online and idle, otherwise to the
  # GitHub-hosted image. Secrets are not passed to PRs from forks, so with an
  # empty token those always run GitHub-hosted. `RUNNER_STATUS_TOKEN` is a
  # fine-grained PAT with "Administration: Read-only" on this repository.
  pick:
    runs-on: ubuntu-latest
    outputs:
      linux: ${{ steps.p.outputs.linux }}
      windows: ${{ steps.p.outputs.windows }}
    steps:
      - id: p
        env:
          GH_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          linux='"ubuntu-24.04"'; windows='"windows-2025"'
          if [ -n "$GH_TOKEN" ]; then
            idle=$(gh api "repos/$REPO/actions/runners" \
              --jq '.runners[] | select(.status=="online" and (.busy|not)) | .labels[].name' || true)
            grep -qix wsl     <<<"$idle" && linux='["self-hosted","wsl"]'
            grep -qix windows <<<"$idle" && windows='["self-hosted","windows"]'
          fi
          echo "linux=$linux"     >> "$GITHUB_OUTPUT"
          echo "windows=$windows" >> "$GITHUB_OUTPUT"

  test:
    needs: pick
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux_amd64
            os: ubuntu-24.04
            cpu: amd64
            pool: linux
          # Build-only, like nimony's i386 job: the test suite regularly breaks
          # on i386 (refs bug #17325), but that the compiler still bootstraps
          # where `int` and pointers are 32 bits is worth asserting on its own.
          - name: Linux_i386
            os: ubuntu-24.04
            cpu: i386
            buildOnly: 'true'
          - name: OSX_arm64
            os: macos-15
            cpu: arm64
          - name: OSX_arm64_cpp
            os: macos-15
            cpu: arm64
            cpp: 'true'
          # see also: `NIM_TEST_PACKAGES`
          - name: Windows_amd64_batch0_3
            os: windows-2025
            cpu: amd64
            batch: '0_3'
            pool: windows
          - name: Windows_amd64_batch1_3
            os: windows-2025
            cpu: amd64
            batch: '1_3'
          - name: Windows_amd64_batch2_3
            os: windows-2025
            cpu: amd64
            batch: '2_3'

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.pool && fromJSON(needs.pick.outputs[matrix.pool]) || matrix.os }}
    timeout-minutes: 90 # `60` led to lots of cancelled jobs

    defaults:
      run:
        shell: bash

    env:
      # `_` is testament's "no batching" value, see `isCurrentBatch`.
      NIM_TESTAMENT_BATCH: ${{ matrix.batch || '_' }}
      NIM_COMPILE_TO_CPP: ${{ matrix.cpp || 'false' }}

    steps:
      - name: 'Disable auto conversion to CRLF by git (Windows-only)'
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - name: 'Checkout'
        uses: actions/checkout@v7
        with:
          fetch-depth: 2 # see D20210329T004830

      - name: 'Install node.js 20.x'
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: 'Install dependencies (amd64 Linux)'
        # Preinstalled on the self-hosted runner (which has no sudo).
        if: runner.os == 'Linux' && matrix.cpu == 'amd64' && runner.environment == 'github-hosted'
        run: |
          set -e
          . ci/funs.sh
          echo_run sudo add-apt-repository universe
          echo_run sudo apt-get update -qq
          DEBIAN_FRONTEND='noninteractive' \
            echo_run sudo apt-get install --no-install-recommends -yq \
              gcc-14 g++-14 libpcre3 liblapack-dev libpcre3 liblapack-dev libcurl4-openssl-dev libgc-dev libsdl1.2-dev libsfml-dev valgrind libc6-dbg
          echo_run sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 60 --slave /usr/bin/g++ g++ /usr/bin/g++-14

      - name: 'Install dependencies (i386 Linux)'
        if: runner.os == 'Linux' && matrix.cpu == 'i386'
        run: |
          set -e
          . ci/funs.sh
          echo_run sudo dpkg --add-architecture i386
          echo_run sudo apt-get update -qq
          # Only a C toolchain: this job bootstraps but runs no tests, so none of
          # the libraries the test suite links against are needed.
          DEBIAN_FRONTEND='noninteractive' \
            echo_run sudo apt-get install --no-install-recommends -yq \
              gcc-multilib g++-multilib

          cat << EOF > bin/gcc
          #!/bin/bash

          exec $(which gcc) -m32 "\$@"
          EOF

          cat << EOF > bin/g++
          #!/bin/bash

          exec $(which g++) -m32 "\$@"
          EOF

          echo_run chmod 755 bin/gcc
          echo_run chmod 755 bin/g++

      - name: 'Install dependencies (OSX)'
        if: runner.os == 'macOS'
        run: brew install boehmgc make sfml
        # XXX can't find boehm on macos 13

      - name: 'Install dependencies (Windows)'
        if: runner.os == 'Windows'
        run: |
          set -e
          . ci/funs.sh
          nimInternalInstallDepsWindows
          echo_run echo "${{ github.workspace }}/dist/mingw64/bin" >> "${GITHUB_PATH}"

      # ccache: the C compiler's output is kept in the GitHub Actions cache. A copy (or link)
      # of ccache named like the compiler is put in front of PATH, so Nim calls `gcc`/`clang`
      # as usual and goes through ccache. Only devel pushes save the cache; PRs read it.
      # Removing these `ccache:` steps turns it off; nothing else depends on them.
      # To run a job without it, add `CCACHE_DISABLE: '1'` to the job's `env`.
      - name: 'ccache: install'
        if: runner.environment == 'github-hosted' && matrix.buildOnly != 'true'
        run: |
          set -e
          # 4.12 or later: older versions hash `-march=native` as written, so an object built
          # for one runner's CPU is reused on another (tests/arc/thard_alignment.nim: SIGILL).
          v=4.14.3
          url=https://github.com/ccache/ccache/releases/download/v$v
          bin="$RUNNER_TEMP/ccache-bin"
          mkdir -p "$bin" "$RUNNER_TEMP/ccache"
          case "$RUNNER_OS" in
            Linux)
              curl -fsSL "$url/ccache-$v-linux-x86_64-glibc.tar.xz" | tar -xJ -C "$RUNNER_TEMP"
              cp "$RUNNER_TEMP/ccache-$v-linux-x86_64-glibc/ccache" "$bin/"
              for c in gcc g++ cc c++; do ln -s ccache "$bin/$c"; done ;;
            macOS)
              curl -fsSL "$url/ccache-$v-darwin.tar.gz" | tar -xz -C "$RUNNER_TEMP"
              cp "$RUNNER_TEMP/ccache-$v-darwin/ccache" "$bin/"
              for c in clang clang++ cc c++; do ln -s ccache "$bin/$c"; done ;;
            Windows)
              curl -fsSL -o "$RUNNER_TEMP/ccache.zip" "$url/ccache-$v-windows-x86_64.zip"
              7z x "$RUNNER_TEMP/ccache.zip" -o"$RUNNER_TEMP" -y > /dev/null
              cp "$RUNNER_TEMP/ccache-$v-windows-x86_64/ccache.exe" "$bin/"
              for c in gcc g++; do cp "$bin/ccache.exe" "$bin/$c.exe"; done ;;
          esac
          export CCACHE_DIR="$RUNNER_TEMP/ccache"  # also for --max-size below
          echo "$bin" >> "$GITHUB_PATH"
          echo "CCACHE_DIR=$CCACHE_DIR" >> "$GITHUB_ENV"
          # the runner image changes; compare the compiler by content, not by its mtime
          echo "CCACHE_COMPILERCHECK=content" >> "$GITHUB_ENV"
          "$bin/ccache" --max-size=2G
          "$bin/ccache" --version | head -1

      - name: 'ccache: restore'
        if: runner.environment == 'github-hosted' && matrix.buildOnly != 'true'
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-${{ matrix.name }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.name }}-

      - name: 'Add build binaries to PATH'
        run: echo "${{ github.workspace }}/bin" >> "${GITHUB_PATH}"

      - name: 'System information'
        run: . ci/funs.sh && nimCiSystemInfo

      - name: 'Build csourcesAny'
        run: . ci/funs.sh && nimBuildCsourcesIfNeeded CC=gcc ucpu='${{ matrix.cpu }}'

      - name: 'koch, Run CI'
        if: matrix.buildOnly != 'true'
        run: . ci/funs.sh && nimInternalBuildKochAndRunCI

      - name: 'koch boot (build-only)'
        # `koch boot` self-hosts until two consecutive compilers are identical, so
        # it runs the freshly built 32 bit compiler (and its VM) on the compiler.
        if: matrix.buildOnly == 'true'
        run: |
          set -e
          . ci/funs.sh
          echo_run nim c koch
          echo_run ./koch boot -d:release

      - name: 'ccache: statistics'
        if: always() && runner.environment == 'github-hosted' && matrix.buildOnly != 'true'
        run: ccache --show-stats

      # Only pushes to devel save, so PRs never add to the repository's 10 GB of cache.
      - name: 'ccache: save'
        if: always() && runner.environment == 'github-hosted' && matrix.buildOnly != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/devel'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-${{ matrix.name }}-${{ github.sha }}
