name: i386 Linux CI

on:
  push:
    branches:
      - 'devel'
  pull_request:
    branches:
      - 'devel'
  workflow_dispatch:


jobs:
  build:
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        branch: [devel]
        target:
          - os: linux
            cpu: i386
            nim_branch: devel
        include:
          - target:
              os: linux
            builder: ubuntu-24.04

    name: '${{ matrix.target.os }}-${{ matrix.target.cpu }}-nim-${{ matrix.target.nim_branch }} (${{ matrix.branch }})'
    runs-on: ${{ matrix.builder }}
    env:
      NIM_DIR: nim-${{ matrix.target.nim_branch }}-${{ matrix.target.cpu }}
      NIM_BRANCH: ${{ matrix.target.nim_branch }}
      NIM_ARCH: ${{ matrix.target.cpu }}
    steps:
      - name: set `core.autocrlf` to false
        run: |
          git config --global core.autocrlf false
          git config --global init.defaultBranch master

      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Install dependencies (Linux i386)
        if: runner.os == 'Linux' && matrix.target.cpu == 'i386'
        working-directory: ${{ github.workspace }}
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND='noninteractive' apt-get install \
            --no-install-recommends -yq gcc-multilib g++-multilib \
            libssl-dev:i386

          mkdir -p external/bin
          cat << EOF > external/bin/gcc
          #!/bin/bash

          exec $(which gcc) -m32 "\$@"
          EOF

          cat << EOF > external/bin/g++
          #!/bin/bash

          exec $(which g++) -m32 "\$@"
          EOF

          chmod 755 external/bin/gcc external/bin/g++

          echo "$PWD/external/bin" >> "${GITHUB_PATH}"

      - name: Add repo bin to PATH
        run: echo "${GITHUB_WORKSPACE}/bin" >> ${GITHUB_PATH}

      - name: Ensure bin/nim is executable
        run: ls -la bin || true

      - name: Build koch using existing nim
        run: |
          if [ -x bin/nim ]; then
            bin/nim c koch
          else
            apt-get install -y --no-install-recommends nim || true
            nim c koch || true
          fi

      - name: Boot the compiler from the checked-out commit
        shell: bash
        run: |
          ./koch boot -d:release || ./koch boot

      - name: Show nim version and system info
        run: |
          bin/nim -v || true
          uname -a || true

      - name: Run talign test (i386)
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${GITHUB_WORKSPACE}/bin:$PATH"
          nim c -r --mm:refc -d:useGcAssert -d:useSysAssert tests/align/talign.nim
