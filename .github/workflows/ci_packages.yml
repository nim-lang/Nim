name: Packages CI
on:
  pull_request:
  push:
    branches:
      - 'devel'
      - 'version-2-2'
      - 'version-2-0'
      - 'version-1-6'
      - 'version-1-2'
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        batch: ["0_3", "1_3", "2_3"] # list of `index_num`
        include:
          # ubuntu-latest is Ubuntu 26.04, which has no libpcre3; run on the
          # same image as ci_main.yml without renaming the jobs
          - os: ubuntu-latest
            image: ubuntu-24.04
            cpu: amd64
          - os: macos-latest
            image: macos-latest
            cpu: arm64
    name: '${{ matrix.os }} (batch: ${{ matrix.batch }})'
    runs-on: ${{ matrix.image }}
    timeout-minutes: 60 # refs bug #18178
    env:
      NIM_TEST_PACKAGES: "1"
      NIM_TESTAMENT_BATCH: ${{ matrix.batch }}
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: 'Install node.js'
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: 'Install dependencies (Linux amd64)'
        if: runner.os == 'Linux' && matrix.cpu == 'amd64'
        run: |
          sudo apt-get update -qq
          DEBIAN_FRONTEND='noninteractive' \
            sudo apt-get install --no-install-recommends -yq \
              libcurl4-openssl-dev libgc-dev libsdl1.2-dev libsfml-dev \
              valgrind libc6-dbg libblas-dev liblapack-dev libpcre3 xorg-dev
      - name: 'Install dependencies (macOS)'
        if: runner.os == 'macOS'
        run: brew install boehmgc make sfml gtk+3
        # XXX can't find boehm and gtk on macos 13
      - name: 'Install dependencies (Windows)'
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -e
          . ci/funs.sh
          nimInternalInstallDepsWindows
          echo_run echo "${{ github.workspace }}/dist/mingw64/bin" >> "${GITHUB_PATH}"

      - name: 'Add build binaries to PATH'
        shell: bash
        run: echo "${{ github.workspace }}/bin" >> "${GITHUB_PATH}"

      - name: 'System information'
        shell: bash
        run: . ci/funs.sh && nimCiSystemInfo

      - name: 'Build csourcesAny'
        shell: bash
        run: . ci/funs.sh && nimBuildCsourcesIfNeeded CC=gcc ucpu='${{ matrix.cpu }}'

      - name: 'Build and test package source cache'
        run: |
          nim c -d:release --out:"$RUNNER_TEMP/package_source_cache" ci/package_source_cache.nim
          nim c -r --out:"$RUNNER_TEMP/test_package_source_cache" ci/test_package_source_cache.nim "$RUNNER_TEMP/package_source_cache"

      - name: 'Package source cache key'
        id: source-key
        env:
          SCOPE: package-sources-v2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.batch }}
          INPUTS: ${{ hashFiles('testament/important_packages.nim', 'testament/packagebatches.nim', 'testament/categories.nim', 'koch.nim', 'ci/package_source_cache.nim', 'ci/test_package_source_cache.nim', '.github/workflows/ci_packages.yml') }}
        run: |
          echo "scope=$SCOPE" >> "$GITHUB_OUTPUT"
          echo "revision=$SCOPE-$INPUTS" >> "$GITHUB_OUTPUT"

      - name: 'Restore package sources'
        id: source-cache
        uses: actions/cache/restore@v6
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/package-sources
          # Never save this lookup key: a matching old exact key would hide a
          # newer scheduled/manual snapshot because Actions caches are immutable.
          key: ${{ steps.source-key.outputs.revision }}-lookup-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ steps.source-key.outputs.revision }}-snapshot-
            ${{ steps.source-key.outputs.scope }}-

      - name: 'Use package sources'
        id: source-setup
        continue-on-error: true
        env:
          # PRs only consume mirrors. Existing devel matrix jobs populate new
          # snapshots when the package list/tooling changes, or on a refresh.
          NIM_CI_GIT_POPULATE: ${{ github.repository == 'nim-lang/Nim' && github.ref == 'refs/heads/devel' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && !startsWith(steps.source-cache.outputs.cache-matched-key, format('{0}-snapshot-', steps.source-key.outputs.revision)))) }}
        run: |
          "$RUNNER_TEMP/package_source_cache" setup "$RUNNER_TEMP/package-sources" "$RUNNER_TEMP/package-source-session"

      - name: 'koch, Run CI'
        shell: bash
        run: . ci/funs.sh && nimInternalBuildKochAndRunCI

      - name: 'Save package sources'
        if: success() && steps.source-setup.outputs.populate == 'true'
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/package-sources
          key: ${{ steps.source-key.outputs.revision }}-snapshot-${{ github.run_id }}-${{ github.run_attempt }}
