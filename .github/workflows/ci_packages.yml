name: Packages CI
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - 'devel'
      - 'version-2-2'
      - 'version-2-0'
      - 'version-1-6'
      - 'version-1-2'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        batch: ["0_3", "1_3", "2_3"] # list of `index_num`
        include:
          - os: ubuntu-latest
            cpu: amd64
          - os: macos-latest
            cpu: arm64
    name: '${{ matrix.os }} (batch: ${{ matrix.batch }})'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60 # refs bug #18178
    env:
      NIM_TEST_PACKAGES: "1"
      NIM_TESTAMENT_BATCH: ${{ matrix.batch }}
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: 'Install node.js'
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: 'Install dependencies (Linux amd64)'
        if: runner.os == 'Linux' && matrix.cpu == 'amd64'
        run: |
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo env DEBIAN_FRONTEND=noninteractive \
            apt-get -o Acquire::Retries=3 install --no-install-recommends -yq \
              libcurl4-openssl-dev libgc-dev libsdl1.2-dev libsfml-dev \
              valgrind libc6-dbg libblas-dev liblapack-dev libpcre3 xorg-dev
      - name: 'Install dependencies (macOS)'
        if: runner.os == 'macOS'
        run: brew install boehmgc make sfml gtk+3
        # XXX can't find boehm and gtk on macos 13
      - name: 'Install dependencies (Windows)'
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -e
          . ci/funs.sh
          nimInternalInstallDepsWindows
          echo_run echo "${{ github.workspace }}/dist/mingw64/bin" >> "${GITHUB_PATH}"

      - name: 'Add build binaries to PATH'
        shell: bash
        run: echo "${{ github.workspace }}/bin" >> "${GITHUB_PATH}"

      - name: 'System information'
        shell: bash
        run: . ci/funs.sh && nimCiSystemInfo

      - name: 'Configure C/C++ compiler cache'
        id: ccache
        uses: ./.github/actions/compiler-cache
        with:
          key: ${{ matrix.os }}-${{ matrix.cpu }}-${{ matrix.batch }}
          # Force real compilation on devel while populating PR caches. PATH
          # wrappers remain: a test inspecting the compiler's executable path
          # could observe them. Use enabled: 'false' for a fully unwrapped run.
          recache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/devel' }}

      - name: 'Build csourcesAny'
        uses: ./.github/actions/bootstrap
        with:
          runner: ${{ matrix.os }}
          cpu: ${{ matrix.cpu }}

      - name: 'koch, Run CI'
        shell: bash
        run: . ci/funs.sh && nimInternalBuildKochAndRunCI

      - name: 'Compiler cache statistics'
        if: ${{ !cancelled() && steps.ccache.outputs.cache-dir != '' }}
        shell: bash
        run: ccache --show-stats

      - name: 'Save compiler results'
        # Refresh on each successful devel commit; PRs only restore base caches.
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/devel' && steps.ccache.outputs.cache-hit != 'true' && steps.ccache.outputs.cache-key != '' }}
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: ${{ steps.ccache.outputs.cache-dir }}
          key: ${{ steps.ccache.outputs.cache-key }}
